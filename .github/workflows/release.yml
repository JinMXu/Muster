name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: TAURI_SIGNING_PRIVATE_KEY must hold the
          # minisign private key (generated via `npx tauri signer generate`).
          # The key was created without a password, so the password secret
          # can stay unset (resolves to empty = no password).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muster ${{ github.ref_name }}"
          releaseBody: "Windows installers below (MSI and NSIS).

- Performance: visibility-aware polling, event-driven git status, cancellable search and PTY output backpressure
- Monaco and file-type icons now load on demand; settings/search/command-palette overlays are lazy-loaded
- Typed IPC: commands, events and DTOs are generated from the Rust definitions and checked in CI
- Settings changes now apply immediately in every open window
- Fixed a duplicate full git-status fetch on first load
- Security: the local IPC token file is restricted to the current user
- CI/release workflows updated to GitHub Actions v5 and Node 22

> Note: versions without the updater component must install this release manually; auto-updates work from 0.1.3 onwards."
          releaseDraft: true
          prerelease: false
