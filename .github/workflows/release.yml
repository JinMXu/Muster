name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: TAURI_SIGNING_PRIVATE_KEY must hold the
          # minisign private key (generated via `npx tauri signer generate`).
          # The key was created without a password, so the password secret
          # can stay unset (resolves to empty = no password).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muster ${{ github.ref_name }}"
          releaseBody: "Windows installers below (MSI and NSIS).

- Fixed a dead strip left in a split column after closing or dragging panes away
- Silenced PSReadLine's 'ListView prediction disabled' warning spam in narrow panes (inline prediction while narrow, restored automatically)
- Git panel rows now show per-file +N -M line counts
- Settings: font family is now a dropdown with common monospace presets; terminal font size is a hand-filled input

> Note: versions without the updater component must install this release manually; auto-updates work from 0.1.3 onwards."
          releaseDraft: true
          prerelease: false
