name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: TAURI_SIGNING_PRIVATE_KEY must hold the
          # minisign private key (generated via `npx tauri signer generate`).
          # The key was created without a password, so the password secret
          # can stay unset (resolves to empty = no password).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muster ${{ github.ref_name }}"
          releaseBody: "Windows installers below (MSI and NSIS).

Highlights:

- Screen-level agent state detection (kero's rule engine, per-agent manifests): working / blocked-on-approval / idle now read from what the agent actually renders, with separate notification cooldowns for approvals
- Restored sessions are stable: terminals refit when font settings apply, PTY resizes that land mid-spawn are no longer lost, restored terminals keep their viewports pinned
- Info and Git panels redesigned around what matters (agent hero card with state pill, git chip line, conditional commit block); sidebars gained visible collapse toggles in their top corners, a minimum width, and icon-only tab chips when narrow
- Pane headers show the running agent's brand icon; gitignored entries fade in the file tree; the settings dialog was rebuilt on shared UI primitives
- Performance: no AppState lock across file/diff loads or agent polling, incremental usage ledger, cached git status, faster startup and tray reopen
- Security: hardened local IPC bridge (connection cap, request deadlines, constant-time token check), replay-safe agent restart commands, screen content kept out of the log file

> Note: auto-updates work from 0.1.3 onwards; first-time installs should run the installer manually."
          releaseDraft: true
          prerelease: false
