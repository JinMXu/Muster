name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: TAURI_SIGNING_PRIVATE_KEY must hold the
          # minisign private key (generated via `npx tauri signer generate`).
          # The key was created without a password, so the password secret
          # can stay unset (resolves to empty = no password).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muster ${{ github.ref_name }}"
          releaseBody: "Windows installers below (MSI and NSIS).

- Coding-agent support expanded to 26 CLI agents with safer process/cmdline matching
- Permission prompts now surface as an approval state; the last agent can be restarted after a relaunch
- New `muster mcp` server exposes 12 tools to MCP clients such as Claude Code and Cursor
- Agent usage panel compares token efficiency by agent and model, with native adapters for Claude Code, Qoder, Kimi Code, Pi, OpenCode, Grok, CodeBuddy and Codex
- `MUSTER_SESSION_ID` is injected into terminal sessions for agent integrations
- CLI: `muster usage` for compare, runs and coverage

> Note: auto-updates work from 0.1.3 onwards; first-time installs should run the installer manually."
          releaseDraft: true
          prerelease: false
