# This machine's toolchain is installed in non-standard locations:
#   - VS 2022 BuildTools: C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools
#   - Windows 10/11 SDK:  D:\Windows Kits\10 (non-standard drive)
# rustc's automatic SDK detection fails, so link.exe cannot find kernel32.lib
# and cc-rs-driven cl.exe cannot find C headers. Provide the search paths here
# so plain `cargo build` / `npx tauri dev` work without vcvars64.
#
# `[env]` entries do NOT override variables that are already set (e.g. inside a
# vcvars64 shell), so they are safe no-ops in a properly configured environment.

[build]
rustflags = [
  "-L", "native=D:\\Windows Kits\\10\\lib\\10.0.22621.0\\um\\x64",
  "-L", "native=D:\\Windows Kits\\10\\lib\\10.0.22621.0\\ucrt\\x64",
]

[env]
INCLUDE = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\include;D:\\Windows Kits\\10\\include\\10.0.22621.0\\ucrt;D:\\Windows Kits\\10\\include\\10.0.22621.0\\um;D:\\Windows Kits\\10\\include\\10.0.22621.0\\shared;D:\\Windows Kits\\10\\include\\10.0.22621.0\\winrt"
LIB = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64;D:\\Windows Kits\\10\\lib\\10.0.22621.0\\um\\x64;D:\\Windows Kits\\10\\lib\\10.0.22621.0\\ucrt\\x64"
